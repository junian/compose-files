name: sql-server-2025
services:
  sql-server-2025:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sql-server-2025
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      # copy .env.example to .env and set your password there
      # - MSSQL_SA_PASSWORD=<password>
    restart: unless-stopped
    volumes:
      - sql-server-2025-volume:/var/opt/mssql
    networks:
      - devnet

networks:
  devnet:
    name: devnet
    external: true

volumes:
  sql-server-2025-volume:
    name: sql-server-2025-volume
