name: sql-server-2017
services:
  sql-server-2017:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: sql-server-2017
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      # copy .env.example to .env and set your password there
      # - MSSQL_SA_PASSWORD=<password>
    restart: unless-stopped
    volumes:
      - sql-server-2017-volume:/var/opt/mssql
    networks:
      - devnet

networks:
  devnet:
    name: devnet
    external: true

volumes:
  sql-server-2017-volume:
    name: sql-server-2017-volume
